name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A03179: ${{ secrets.A03179 }}
          B81040: ${{ secrets.B81040 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A03179', '')
          sec_b = os.environ.get('B81040', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 8f842773bf8bb906e91f71ae98dce4c68752 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 9a58219f2a0cd633635681b922ea78602f548bb76511cf -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
